name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "Fetch FFmpeg (GPL build with x264, x265, SVT-AV1, AOM, NVENC, QSV, AMF)"
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo "$bin" >> $env:GITHUB_PATH
          echo "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV
          echo "FFMPEG_LICENSE=$((Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p ferrous -p ferrous-vcam-source -p ferrous-obs-host -p ferrous-example-plugin

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, dist/plugins, dist/ffmpeg, dist-redist, release | Out-Null
          Copy-Item target/release/ferrous.exe "dist/Ferrous Studio.exe"
          Copy-Item target/release/ferrous_vcam_source.dll dist/ferrous_vcam.dll
          Copy-Item target/release/ferrous-obs-host.exe dist/
          Copy-Item target/release/ferrous_example_plugin.dll dist/plugins/
          Copy-Item "$env:FFMPEG_BIN/ffmpeg.exe" dist/
          Copy-Item "$env:FFMPEG_BIN/ffprobe.exe" dist/
          if ($env:FFMPEG_LICENSE) { Copy-Item $env:FFMPEG_LICENSE dist/ffmpeg/LICENSE.txt }
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          # The WebView2 loader, if this build links it dynamically (browser sources and docks).
          # Always shipped (harmless if the exe links the loader statically).
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE/.cargo" }
          $loader = Get-ChildItem "$cargoHome/registry/src" -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $loader) { throw "WebView2Loader.dll (x64) not found" }
          Copy-Item $loader.FullName dist/
          # Microsoft's WebView2 bootstrapper, run by the installer only where WebView2 is missing.
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist-redist/MicrosoftEdgeWebview2Setup.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path dist/* -DestinationPath "release/FerrousStudio-$version-portable-win64.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer/FerrousStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: FerrousStudio-windows-x64
          path: release/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ferrous Studio ${{ env.APP_VERSION }}
          body_path: docs/RELEASE_NOTES.md
          files: release/*
